<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta name="description" content="Biney Medical Centre — Private primary hospital in Italian Flats, Community 2, Tema, Ghana. General care, ENT, and pregnancy services." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2850/2850367.png" />

    <!-- Critical origin connections — eliminates cold TCP/TLS handshakes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only preconnect to Spline on desktop — mobile never loads it -->
    <link rel="dns-prefetch" href="https://prod.spline.design" />

    <!--
      CRITICAL FONTS: Inter + Outfit — used everywhere.
      Non-blocking load: media="print" trick prevents render-blocking.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
      />
    </noscript>

    <!--
      DEFERRED FONTS: Pacifico (loading screen title only) + Manrope (body text).
      Loaded after page is interactive — display=optional prevents layout shift.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Manrope:wght@400;600;700;800&display=optional"
      media="print"
      onload="this.media='all'"
    />

    <title>Biney Medical Centre | Tema, Ghana</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
